name: Design review
on:
  push:
    branches: ["design/2026-09-renewal"]
permissions:
  contents: read
jobs:
  responsive-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install browser for layout review
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Check preserved content, responsive layout, links, and motion
        run: node scripts/check-design.mjs
